[project]
name = "govverify"
version = "1.0.0"
description = "Government Document Conflict Detection & Verification System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pymongo>=4.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "python-docx>=1.0.0"
]

[tool.pyright]
extraPaths = ["backend"]

